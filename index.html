<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INTAKE</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0e14;
        --panel: #131826;
        --panel-2: #171d2e;
        --border: #262e45;
        --accent: #e0b23b;
        --accent-2: #8b93a7;
        --danger: #e0664b;
        --ok: #5bb98c;
        --text: #e6e9f0;
        --text-dim: #8b93a7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(1200px 800px at 50% -10%, #17203a 0%, var(--bg) 55%);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        padding: 28px 16px 60px;
      }

      /* faint CRT-style scanlines over the whole page for an institutional,
         under-fluorescent-light feel */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: overlay;
        opacity: 0.5;
        animation: flicker 7s infinite steps(1);
      }

      @keyframes flicker {
        0%,
        92%,
        100% {
          opacity: 0.5;
        }
        93% {
          opacity: 0.32;
        }
        95% {
          opacity: 0.6;
        }
        97% {
          opacity: 0.38;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before {
          animation: none;
        }
      }

      .app {
        width: 100%;
        max-width: 640px;
      }

      header.top {
        position: relative;
        text-align: center;
        margin-bottom: 22px;
        padding: 28px 16px 22px;
        border-radius: 14px;
        overflow: hidden;
      }

      header.top::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 3px, transparent 3px 30px);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
        mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
      }

      header.top::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(420px 160px at 50% 0%, rgba(224, 178, 59, 0.12), transparent 70%);
      }

      header.top > * {
        position: relative;
      }

      .eyebrow {
        font-family: "Barlow Condensed", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        font-size: 11px;
        color: var(--text-dim);
        margin-bottom: 8px;
      }

      header.top h1 {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 34px;
        margin: 0;
        color: var(--accent);
        text-shadow: 0 0 24px rgba(224, 178, 59, 0.25);
      }

      header.top p {
        margin: 4px 0 0;
        color: var(--text-dim);
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      .top-divider {
        width: 120px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border), transparent);
        margin: 16px auto 0;
        position: relative;
      }

      .top-divider::after {
        content: "";
        position: absolute;
        left: 50%;
        top: -2px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        transform: translateX(-50%);
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.7);
      }

      .card-body {
        padding: 24px;
      }

      /* ---- first-person scene art ---- */

      .scene {
        position: relative;
        height: 210px;
        overflow: hidden;
        border-bottom: 1px solid var(--border);
        background: #05070c;
        transition: filter 0.6s ease;
      }

      .scene svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .scene .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 42%, transparent 32%, rgba(4, 5, 9, 0.68) 100%);
        pointer-events: none;
      }

      .scene .scene-scan {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 3px);
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      .scene .tag {
        position: absolute;
        left: 14px;
        bottom: 12px;
        font-family: "Barlow Condensed", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      }

      .scene .beat-dim {
        position: absolute;
        inset: 0;
        background: rgba(4, 5, 9, 0.4);
      }

      /* ---- reaction beat ---- */

      .beat-body {
        text-align: center;
        padding-top: 30px;
        padding-bottom: 26px;
      }

      .beat-text {
        font-family: "Barlow Condensed", sans-serif;
        font-style: italic;
        font-weight: 600;
        font-size: 19px;
        line-height: 1.5;
        color: var(--text);
        margin: 0 0 20px;
      }

      .delta-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 4px;
      }

      .delta-chip {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text-dim);
      }

      .delta-chip.up {
        color: var(--ok);
        border-color: rgba(91, 185, 140, 0.4);
      }

      .delta-chip.down {
        color: var(--danger);
        border-color: rgba(224, 102, 75, 0.4);
      }

      /* ---- character creation ---- */

      label.field {
        display: block;
        margin-bottom: 18px;
      }

      label.field span {
        display: block;
        font-family: "Barlow Condensed", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 13px;
        color: var(--text-dim);
        margin-bottom: 6px;
      }

      input[type="text"] {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 15px;
      }

      input[type="text"]:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .archetypes {
        display: grid;
        gap: 10px;
      }

      .archetype {
        position: relative;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        transition: border-color 0.15s;
      }

      .archetype:hover {
        border-color: var(--accent-2);
      }

      .archetype.selected {
        border-color: var(--accent);
        background: #1d1a12;
      }

      .archetype-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
        padding-right: 40px;
      }

      .archetype-icon {
        flex: none;
        width: 26px;
        height: 26px;
        color: var(--text-dim);
        transition: color 0.15s;
      }

      .archetype-icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .archetype:hover .archetype-icon,
      .archetype.selected .archetype-icon {
        color: var(--accent);
      }

      .archetype h3 {
        margin: 0;
        font-family: "Barlow Condensed", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        font-size: 17px;
      }

      .archetype p {
        margin: 0;
        color: var(--text-dim);
        font-size: 13px;
        line-height: 1.4;
      }

      .archetype-tag {
        position: absolute;
        top: 12px;
        right: 14px;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        opacity: 0.65;
      }

      button {
        font-family: "Barlow Condensed", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 700;
        font-size: 15px;
        padding: 11px 20px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--accent);
        cursor: pointer;
        width: 100%;
      }

      button.primary {
        background: var(--accent);
        color: #14110a;
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      button:not(:disabled):active {
        transform: scale(0.99);
      }

      /* ---- HUD ---- */

      .hud {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 16px;
      }

      .stat {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
      }

      .stat span.label {
        display: block;
        font-family: "Barlow Condensed", sans-serif;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.05em;
        color: var(--text-dim);
        margin-bottom: 4px;
      }

      .bar {
        height: 5px;
        border-radius: 3px;
        background: #232a3d;
        overflow: hidden;
      }

      .bar > i {
        display: block;
        height: 100%;
        background: var(--accent-2);
        transition: width 0.3s;
      }

      .bar.respect > i {
        background: #e0b23b;
      }
      .bar.health > i {
        background: #5bb98c;
      }
      .bar.sanity > i {
        background: #7aa2e0;
      }
      .bar.heat > i {
        background: #e0664b;
      }

      .progress {
        font-size: 12px;
        color: var(--text-dim);
        text-align: right;
        margin-bottom: 10px;
        letter-spacing: 0.03em;
      }

      /* ---- narrative ---- */

      .chapter-title {
        font-family: "Barlow Condensed", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 22px;
        margin: 0 0 12px;
        color: var(--text);
      }

      .body-text p {
        line-height: 1.6;
        color: #d3d7e2;
        margin: 0 0 12px;
        font-size: 15px;
      }

      .choices {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .choices button {
        text-align: left;
        text-transform: none;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 14.5px;
        letter-spacing: 0;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 13px 16px;
      }

      .choices button:hover {
        border-color: var(--accent);
      }

      /* ---- ending ---- */

      .ending-title {
        font-family: "Barlow Condensed", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 30px;
        margin: 0 0 6px;
      }

      .ending-title.good {
        color: var(--ok);
      }
      .ending-title.bad {
        color: var(--danger);
      }
      .ending-title.mixed {
        color: var(--accent);
      }

      .ending-sub {
        color: var(--text-dim);
        font-size: 13px;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .summary {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-dim);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 16px;
      }

      .summary b {
        color: var(--text);
      }

      footer.credit {
        text-align: center;
        margin-top: 18px;
        color: var(--text-dim);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="eyebrow">Correctional Intake File</div>
        <h1>Intake</h1>
        <p>A choice-driven story. Every decision follows you.</p>
        <div class="top-divider"></div>
      </header>
      <div id="root"></div>
      <footer class="credit">Fiction. No affiliation with any real facility, agency, or person.</footer>
    </div>

    <script>
      (function () {
        const root = document.getElementById("root");

        /* ---------------- state ---------------- */

        const ICON = {
          card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9.5" cy="10.5" r="2"/><line x1="7.5" y1="15" x2="11.5" y2="15"/><line x1="14" y1="9" x2="17" y2="9"/><line x1="14" y1="12" x2="17" y2="12"/></svg>',
          dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="10" height="10" rx="2"/><rect x="10" y="4" width="10" height="10" rx="2"/><circle cx="7.6" cy="12.6" r="0.9" fill="currentColor" stroke="none"/><circle cx="10.4" cy="15.4" r="0.9" fill="currentColor" stroke="none"/><circle cx="13.6" cy="7.6" r="0.9" fill="currentColor" stroke="none"/><circle cx="16.4" cy="10.4" r="0.9" fill="currentColor" stroke="none"/></svg>',
          fist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="10.5" width="13" height="8" rx="3.5"/><line x1="8.5" y1="10.5" x2="8.5" y2="6.5"/><line x1="12" y1="10.5" x2="12" y2="5.5"/><line x1="15.5" y1="10.5" x2="15.5" y2="6.5"/></svg>',
          link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="4.2"/><circle cx="15" cy="12" r="4.2"/></svg>',
        };

        const ARCHETYPES = [
          {
            id: "naive",
            name: "Wrong Place, Wrong Time",
            desc: "First offense. You still can't quite believe you're here.",
            icon: ICON.card,
            tag: "FILE A-01",
            stats: { muscle: 4, smarts: 7, connections: 4 },
            respect: 3,
            heat: 2,
            sentence: 52,
            flags: ["naive"],
          },
          {
            id: "hustler",
            name: "Small-Time Hustler",
            desc: "Not your first time inside, and you know how to work an angle.",
            icon: ICON.dice,
            tag: "FILE A-02",
            stats: { muscle: 5, smarts: 6, connections: 6 },
            respect: 4,
            heat: 3,
            sentence: 78,
            flags: ["hustler"],
          },
          {
            id: "enforcer",
            name: "The Enforcer",
            desc: "A violent charge got you here. People already know your name.",
            icon: ICON.fist,
            tag: "FILE A-03",
            stats: { muscle: 7, smarts: 4, connections: 5 },
            respect: 6,
            heat: 4,
            sentence: 104,
            flags: ["enforcer"],
          },
          {
            id: "affiliated",
            name: "Affiliated",
            desc: "You came in with backup. The Yard Crew already claims you.",
            icon: ICON.link,
            tag: "FILE A-04",
            stats: { muscle: 6, smarts: 4, connections: 7 },
            respect: 5,
            heat: 5,
            sentence: 91,
            flags: ["affiliated", "yard_crew"],
          },
        ];

        let state = null;
        let selectedArchetype = ARCHETYPES[0].id;

        function newState(name, archetype) {
          return {
            name,
            archetype: archetype.id,
            muscle: archetype.stats.muscle,
            smarts: archetype.stats.smarts,
            connections: archetype.stats.connections,
            respect: archetype.respect,
            health: 8,
            sanity: 8,
            heat: archetype.heat,
            sentence: archetype.sentence,
            flags: new Set(archetype.flags),
          };
        }

        function clamp(n) {
          return Math.max(0, Math.min(10, n));
        }

        function applyEffect(effect) {
          if (!effect) return;
          ["muscle", "smarts", "connections", "respect", "health", "sanity", "heat"].forEach((k) => {
            if (effect[k]) state[k] = clamp(state[k] + effect[k]);
          });
          if (effect.sentence) state.sentence = Math.max(0, state.sentence + effect.sentence);
          if (effect.addFlags) effect.addFlags.forEach((f) => state.flags.add(f));
        }

        /* ---------------- story graph ---------------- */

        const CHAPTER_OF = {
          intake: 1,
          cell: 2,
          yard: 3,
          work: 4,
          conflict1: 5,
          shakedown: 6,
          shakedown_weapon: 6,
          letter: 7,
          program: 8,
          bigfight: 9,
          hearing: 10,
        };
        const TOTAL_CHAPTERS = 10;

        const SCENE_OF = {
          intake: "processing",
          cell: "cell",
          yard: "yard",
          work: "work",
          conflict1: "tension",
          shakedown: "lockdown",
          shakedown_weapon: "lockdown",
          letter: "window",
          program: "classroom",
          bigfight: "showdown",
          hearing: "hearing",
        };

        const SCENE_LABEL = {
          intake: "Processing — Intake",
          cell: "Cell Block C",
          yard: "The Yard",
          work: "Work Detail",
          conflict1: "An Ask",
          shakedown: "Shakedown",
          shakedown_weapon: "Shakedown",
          letter: "Visitation / Mail",
          program: "Program Room",
          bigfight: "The Yard — Showdown",
          hearing: "Parole Board",
        };

        /* ---------------- scene art (inline SVG, first-person framing) ---------------- */

        function svgWrap(inner) {
          return `<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
        }

        const GATE_TONES = {
          good: { c1: "#2a2418", c2: "#0c0a06", light: "#e0b23b", op: 0.5 },
          bad: { c1: "#241418", c2: "#0a0608", light: "#e0664b", op: 0.22 },
          mixed: { c1: "#1c202c", c2: "#0a0c12", light: "#8b93a7", op: 0.3 },
        };

        function sceneSVG(kind, tone) {
          switch (kind) {
            case "processing":
              return svgWrap(`
                <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#1b2338"/><stop offset="100%" stop-color="#0c0f18"/>
                </linearGradient></defs>
                <rect width="400" height="220" fill="url(#g1)"/>
                <g opacity="0.55"><rect x="40" y="18" width="90" height="6" rx="3" fill="#cfe0ff"/><rect x="270" y="18" width="90" height="6" rx="3" fill="#cfe0ff"/></g>
                <ellipse cx="85" cy="40" rx="120" ry="60" fill="#3a4a72" opacity="0.25"/>
                <ellipse cx="315" cy="40" rx="120" ry="60" fill="#3a4a72" opacity="0.25"/>
                <g fill="#060810">
                  <rect x="30" y="150" width="34" height="40" rx="3"/><rect x="80" y="150" width="34" height="40" rx="3"/>
                  <rect x="130" y="150" width="34" height="40" rx="3"/><rect x="236" y="150" width="34" height="40" rx="3"/>
                  <rect x="286" y="150" width="34" height="40" rx="3"/><rect x="336" y="150" width="34" height="40" rx="3"/>
                </g>
                <rect x="0" y="190" width="400" height="30" fill="#05070c"/>
              `);
            case "cell":
              return svgWrap(`
                <defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#182036"/><stop offset="100%" stop-color="#0a0d16"/>
                </linearGradient></defs>
                <rect width="400" height="220" fill="url(#g2)"/>
                <rect x="300" y="30" width="50" height="60" rx="2" fill="#3a4a72" opacity="0.4"/>
                <rect x="40" y="140" width="160" height="14" fill="#05070c"/>
                <rect x="50" y="110" width="140" height="10" fill="#05070c" opacity="0.8"/>
                <g fill="#030407">
                  <rect x="10" y="0" width="10" height="220"/><rect x="70" y="0" width="10" height="220"/>
                  <rect x="130" y="0" width="10" height="220"/><rect x="190" y="0" width="10" height="220"/>
                  <rect x="250" y="0" width="10" height="220"/><rect x="310" y="0" width="10" height="220"/>
                  <rect x="370" y="0" width="10" height="220"/>
                </g>
              `);
            case "yard":
              return svgWrap(`
                <defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#25314f"/><stop offset="60%" stop-color="#141b2c"/><stop offset="100%" stop-color="#0a0d16"/>
                </linearGradient></defs>
                <rect width="400" height="220" fill="url(#g3)"/>
                <rect x="0" y="120" width="400" height="14" fill="#05070c"/>
                <g fill="#05070c" opacity="0.85">
                  <rect x="20" y="90" width="4" height="44"/><rect x="60" y="90" width="4" height="44"/>
                  <rect x="100" y="90" width="4" height="44"/><rect x="300" y="90" width="4" height="44"/>
                  <rect x="340" y="90" width="4" height="44"/><rect x="380" y="90" width="4" height="44"/>
                </g>
                <g fill="#05070c">
                  <circle cx="160" cy="118" r="5"/><rect x="155" y="123" width="10" height="16" rx="3"/>
                  <circle cx="185" cy="120" r="5"/><rect x="180" y="125" width="10" height="14" rx="3"/>
                  <circle cx="230" cy="119" r="5"/><rect x="225" y="124" width="10" height="15" rx="3"/>
                </g>

        function moodFilter(s) {
          if (!s) return "none";
          const f = [];
          if (s.sanity <= 4) f.push("saturate(0.5)", "contrast(0.94)");
          else if (s.sanity <= 6) f.push("saturate(0.78)");
          if (s.heat >= 7) f.push("sepia(0.18)", "hue-rotate(-6deg)", "contrast(1.08)");
          return f.length ? f.join(" ") : "none";
        }

        function renderScene(kind, label, tone, dim) {
          const overlays = [el("div", { class: "vignette" }), el("div", { class: "scene-scan" })];
          if (label) overlays.push(el("div", { class: "tag" }, [document.createTextNode(label)]));
          if (dim) overlays.push(el("div", { class: "beat-dim" }));
          return el(
            "div",
            { class: "scene", html: sceneSVG(kind, tone), style: `filter:${moodFilter(state)}` },
            overlays
          );
        }

          respect: "Respect",
          health: "Health",
          sanity: "Sanity",
          heat: "Heat",
        };

        function snapshotStats(s) {
          const o = {};
          STAT_KEYS.forEach((k) => (o[k] = s[k]));
          return o;
        }

        function diffStats(before, after) {
          return STAT_KEYS.map((k) => ({ key: k, delta: after[k] - before[k] })).filter((d) => d.delta !== 0);
        }

              title: "Written Off",
              lines: [
                "You're going home, but not the way you pictured it — banged up, worn down, a file full of incident reports that'll follow you into every job application for years. You made it out. What's left of you made it out too, mostly.",
              ],
            };
          }
          if (s.flags.has("lone_wolf") && s.sanity <= 4) {
            return {
              tone: "mixed",
              title: "Ghost",
              lines: [
                "You never joined anything, never owed anyone, never let anyone close enough to use against you. It worked. You also walk out the gate not really knowing how to let anyone close at all, and nobody's waiting on the other side to teach you.",
              ],
            };
          }
          return {
            tone: "mixed",
            title: "Just Time",
            lines: [
              `You did the ${s.sentence} weeks. No headline ending, no clean redemption, no disaster — just a sentence served and a version of you that came out changed in ways you're still finding.`,
              "Whatever happens next is the part nobody in there could write for you.",
            ],
          };
        }

        /* ---------------- rendering ---------------- */

        function el(tag, attrs, children) {
          const e = document.createElement(tag);
          if (attrs) {
            Object.keys(attrs).forEach((k) => {
              if (k === "class") e.className = attrs[k];
              else if (k === "html") e.innerHTML = attrs[k];
              else e.setAttribute(k, attrs[k]);
            });
          }
          (children || []).forEach((c) => e.appendChild(c));
          return e;
        }

        function renderCreation() {
          root.innerHTML = "";
          const card = el("div", { class: "card" });
          card.appendChild(renderScene("processing", "Intake — Processing Room"));

          const body = el("div", { class: "card-body" });

          const nameLabel = el("label", { class: "field" });
          nameLabel.appendChild(el("span", {}, [document.createTextNode("Your name")]));
          const nameInput = el("input", { type: "text", id: "nameInput", placeholder: "e.g. Marcus Webb" });
          nameLabel.appendChild(nameInput);
          body.appendChild(nameLabel);

          const bgLabel = el("label", { class: "field" });
          bgLabel.appendChild(el("span", {}, [document.createTextNode("How did you get here?")]));
          body.appendChild(bgLabel);

          const grid = el("div", { class: "archetypes" });
          ARCHETYPES.forEach((a) => {
            const box = el("div", { class: "archetype" + (a.id === selectedArchetype ? " selected" : "") });
            const head = el("div", { class: "archetype-head" });
            head.appendChild(el("div", { class: "archetype-icon", html: a.icon }));
            head.appendChild(el("h3", {}, [document.createTextNode(a.name)]));
            box.appendChild(head);
            box.appendChild(el("p", {}, [document.createTextNode(a.desc)]));
            box.appendChild(el("span", { class: "archetype-tag" }, [document.createTextNode(a.tag)]));
            box.addEventListener("click", () => {
              selectedArchetype = a.id;
              renderCreation();
              document.getElementById("nameInput").value = nameInput.value;
            });
            grid.appendChild(box);
          });
          body.appendChild(grid);

          const startBtn = el("button", { class: "primary", style: "margin-top:18px" }, [
            document.createTextNode("Start Your Sentence"),
          ]);
          startBtn.addEventListener("click", () => {
            const name = nameInput.value.trim() || "You";
            const archetype = ARCHETYPES.find((a) => a.id === selectedArchetype);
            state = newState(name, archetype);
            goTo("intake");
          });
          body.appendChild(startBtn);

          card.appendChild(body);
          root.appendChild(card);
          nameInput.focus();
        }

        function statBar(label, value, cls) {
          const wrap = el("div", { class: "stat" });
          wrap.appendChild(el("span", { class: "label" }, [document.createTextNode(label)]));
          const bar = el("div", { class: "bar " + cls });
          bar.appendChild(el("i", { style: `width:${value * 10}%` }));
          wrap.appendChild(bar);
          return wrap;
        }

        function renderHUD() {
          const hud = el("div", { class: "hud" });
          hud.appendChild(statBar("Respect", state.respect, "respect"));
          hud.appendChild(statBar("Health", state.health, "health"));
          hud.appendChild(statBar("Sanity", state.sanity, "sanity"));
          hud.appendChild(statBar("Heat", state.heat, "heat"));
          return hud;
        }

        function goTo(nodeId) {
          let node = NODES[nodeId];
          if (node && node.redirect) {
            const r = node.redirect(state);
            if (r) node = NODES[r];
          }
          if (!node) {
            renderEnding();
            return;
          }
          renderNode(nodeId, node);
        }

        function renderNode(nodeId, node) {
          root.innerHTML = "";
          root.appendChild(renderHUD());

          const chapterNum = CHAPTER_OF[nodeId] || CHAPTER_OF[node.chapterKey] || null;
          if (chapterNum) {
            root.appendChild(
              el("div", { class: "progress" }, [
                document.createTextNode(`Chapter ${chapterNum} of ${TOTAL_CHAPTERS}`),
              ])
            );
          }

          const card = el("div", { class: "card" });
          const sceneKind = SCENE_OF[nodeId] || "processing";
          const sceneLabel = SCENE_LABEL[nodeId] || node.title;
          card.appendChild(renderScene(sceneKind, sceneLabel));

          const body = el("div", { class: "card-body" });
          body.appendChild(el("h2", { class: "chapter-title" }, [document.createTextNode(node.title)]));

          const textWrap = el("div", { class: "body-text" });
          node.text(state).forEach((p) => textWrap.appendChild(el("p", {}, [document.createTextNode(p)])));
          body.appendChild(textWrap);

          const choicesWrap = el("div", { class: "choices" });
          node.choices(state).forEach((choice) => {
            const btn = el("button", {}, [document.createTextNode(choice.label)]);
            btn.addEventListener("click", () => {
              const before = snapshotStats(state);
              applyEffect(choice.effect);
              const deltas = diffStats(before, state);
              if (choice.feel) {
                renderBeat(nodeId, choice.feel, deltas, choice.next);
              } else if (choice.next === "ending") {
                renderEnding();
              } else {
                goTo(choice.next);
              }
            });
            choicesWrap.appendChild(btn);
          });
          body.appendChild(choicesWrap);

          card.appendChild(body);
          root.appendChild(card);
        }

        function renderBeat(nodeId, feelText, deltas, nextId) {
          root.innerHTML = "";
          root.appendChild(renderHUD());

          const card = el("div", { class: "card" });
          const sceneKind = SCENE_OF[nodeId] || "processing";
          const sceneLabel = SCENE_LABEL[nodeId] || "";
          card.appendChild(renderScene(sceneKind, sceneLabel, null, true));

          const body = el("div", { class: "card-body beat-body" });
          body.appendChild(el("p", { class: "beat-text" }, [document.createTextNode(feelText)]));

          if (deltas.length) {
            const chips = el("div", { class: "delta-row" });
            deltas.forEach((d) => {
              const sign = d.delta > 0 ? "+" : "";
              chips.appendChild(
                el("span", { class: "delta-chip " + (d.delta > 0 ? "up" : "down") }, [
                  document.createTextNode(`${STAT_LABELS[d.key]} ${sign}${d.delta}`),
                ])
              );
            });
            body.appendChild(chips);
          }

          const cont = el("button", { class: "primary", style: "margin-top:18px" }, [
            document.createTextNode("Continue"),
          ]);
          cont.addEventListener("click", () => {
            if (nextId === "ending") renderEnding();
            else goTo(nextId);
          });
          body.appendChild(cont);

          card.appendChild(body);
          root.appendChild(card);
        }

        function renderEnding() {
          const ending = computeEnding(state);
          root.innerHTML = "";
          root.appendChild(renderHUD());

          const card = el("div", { class: "card" });
          card.appendChild(renderScene("gate", "Release", ending.tone));

          const body = el("div", { class: "card-body" });
          body.appendChild(
            el("h2", { class: "ending-title " + ending.tone }, [document.createTextNode(ending.title)])
          );
          body.appendChild(
            el("div", { class: "ending-sub" }, [document.createTextNode(`${state.name} — end of story`)])
          );

          const textWrap = el("div", { class: "body-text" });
          ending.lines.forEach((p) => textWrap.appendChild(el("p", {}, [document.createTextNode(p)])));
          body.appendChild(textWrap);

          const summary = el("div", { class: "summary" });
          const rows = [
            ["Respect", state.respect],
            ["Health", state.health],
            ["Sanity", state.sanity],
            ["Heat", state.heat],
            ["Muscle", state.muscle],
            ["Smarts", state.smarts],
            ["Connections", state.connections],
            ["Sentence", state.sentence + " wks"],
          ];
          rows.forEach(([label, value]) => {
            const d = document.createElement("div");
            const b = document.createElement("b");
            b.textContent = String(value);
            d.appendChild(document.createTextNode(label + ": "));
            d.appendChild(b);
            summary.appendChild(d);
          });
          body.appendChild(summary);

          const again = el("button", { class: "primary", style: "margin-top:20px" }, [
            document.createTextNode("Play Again"),
          ]);
          again.addEventListener("click", () => {
            selectedArchetype = ARCHETYPES[0].id;
            renderCreation();
          });
          body.appendChild(again);

          card.appendChild(body);
          root.appendChild(card);
        }

        renderCreation();
      })();
    </script>
  </body>
</html>
